name: Build downloads

# Runs when you publish a GitHub Release (and can be started by hand from the Actions tab).
# It builds the .jar plus ready-to-run apps with Java bundled inside for Windows, macOS and Linux,
# and attaches them to the release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    name: Runnable jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the jar
        run: |
          mkdir out
          javac --release 11 -encoding UTF-8 -d out *.java
          printf 'Main-Class: SpreadsheetApp\n' > manifest.txt
          jar cfm SpreadsheetPro.jar manifest.txt -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: SpreadsheetPro.jar
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" SpreadsheetPro.jar --clobber

  bundle:
    name: App with Java inside (${{ matrix.label }})
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset: SpreadsheetPro-Windows
          - os: macos-latest
            label: macOS
            asset: SpreadsheetPro-macOS
          - os: ubuntu-latest
            label: Linux
            asset: SpreadsheetPro-Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: input
      - name: Work out the version number
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          V="${TAG#v}"
          if ! [[ "$V" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then V="1.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build the app (Java is bundled, nothing to install)
        run: |
          jpackage --type app-image --name "Spreadsheet Pro" --app-version "${{ steps.ver.outputs.version }}" \
            --input input --main-jar SpreadsheetPro.jar --main-class SpreadsheetApp \
            --add-modules java.base,java.desktop,java.prefs,java.logging,java.xml \
            --dest dist
      - name: Zip it
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            tar -czf "../${{ matrix.asset }}.tar.gz" .
            echo "FILE=${{ matrix.asset }}.tar.gz" >> "$GITHUB_ENV"
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "../${{ matrix.asset }}.zip" . > /dev/null
            echo "FILE=${{ matrix.asset }}.zip" >> "$GITHUB_ENV"
          else
            ditto -c -k --keepParent "Spreadsheet Pro.app" "../${{ matrix.asset }}.zip"
            echo "FILE=${{ matrix.asset }}.zip" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ env.FILE }}
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$FILE" --clobber
